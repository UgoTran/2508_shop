<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="container mt-4">
    <h2 class="text-center mb-4 text-uppercase fw-bold text-primary">Danh sách sản phẩm</h2>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="fas fa-check-circle me-2"></i><span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card p-3 mb-3 shadow-sm bg-light">
        <div class="row g-3 align-items-center">
            <div class="col-md-8">
                <form th:action="@{/admin/products}" method="get" class="d-flex">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control me-2" placeholder="Tìm theo tên, danh mục, loại...">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i> Tìm</button>
                    <a th:if="${keyword != null && !keyword.isEmpty()}" th:href="@{/admin/products}" class="btn btn-outline-secondary ms-2">
                        <i class="fas fa-sync-alt"></i>
                    </a>
                </form>
            </div>
            <div class="col-md-4 text-md-end text-start">
                <a th:href="@{/admin/products/add}" class="btn btn-success">
                    <i class="fas fa-plus-circle me-1"></i> Thêm sản phẩm
                </a>
            </div>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover shadow-sm align-middle">
            <thead class="table-dark text-center">
            <tr>
                <th>ID</th>
                <th>Tên sản phẩm</th>
                <th>Danh mục</th>
                <th>Loại</th>
                <th>Giá bán</th>
                <th>Trạng thái</th>
                <th style="width: 150px;">Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.productId}" class="text-center"></td>
                <td th:text="${product.productName}" class="fw-bold text-primary"></td>
                <td th:text="${product.categoryName}"></td>
                <td th:text="${product.productType}"></td>

                <td class="text-end fw-bold text-danger"
                    th:text="${#numbers.formatDecimal(product.productPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                </td>

                <td class="text-center">
                    <a th:href="@{/admin/products/toggle-status/{id}(id=${product.productId})}"
                       th:class="${product.active} ? 'btn btn-sm btn-outline-success rounded-pill px-3' : 'btn btn-sm btn-outline-secondary rounded-pill px-3'"
                       style="min-width: 80px;">
                        <i th:class="${product.active} ? 'fas fa-toggle-on me-1' : 'fas fa-toggle-off me-1'"></i>
                        <span th:text="${product.active} ? 'Bán' : 'Ngừng'"></span>
                    </a>
                </td>

                <td class="text-center">
                    <div class="btn-group" role="group">
                        <a th:href="@{/admin/products/{id}(id=${product.productId})}" class="btn btn-sm btn-info text-white" title="Xem">
                            <i class="fas fa-eye"></i>
                        </a>
                        <a th:href="@{/admin/products/edit/{id}(id=${product.productId})}" class="btn btn-sm btn-warning text-white" title="Sửa">
                            <i class="fas fa-edit"></i>
                        </a>
                        <form th:action="@{/admin/products/delete/{id}(id=${product.productId})}" method="post" style="display:inline;"
                              onsubmit="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này không?');">
                            <button type="submit" class="btn btn-sm btn-danger" title="Xóa">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>

            <tr th:if="${products.isEmpty()}">
                <td colspan="7" class="text-center py-4 text-muted">
                    <i class="fas fa-box-open fa-3x mb-3"></i><br>
                    Không tìm thấy sản phẩm nào phù hợp.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${totalPages > 1}" class="d-flex justify-content-between align-items-center mt-3">

        <div class="text-muted small">
            Hiển thị trang <b th:text="${currentPage}"></b> trên tổng số <b th:text="${totalPages}"></b> trang
            (Tổng <b th:text="${totalItems}"></b> sản phẩm).
        </div>

        <nav aria-label="Page navigation">
            <ul class="pagination mb-0">

                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/products(pageNo=${currentPage - 1}, keyword=${keyword})}">
                        <i class="fas fa-chevron-left"></i>
                    </a>
                </li>

                <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
                    th:classappend="${currentPage == i} ? 'active'">
                    <a class="page-link" th:href="@{/admin/products(pageNo=${i}, keyword=${keyword})}" th:text="${i}"></a>
                </li>

                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/products(pageNo=${currentPage + 1}, keyword=${keyword})}">
                        <i class="fas fa-chevron-right"></i>
                    </a>
                </li>

            </ul>
        </nav>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
