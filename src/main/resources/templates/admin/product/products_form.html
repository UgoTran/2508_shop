<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header bg-info text-white">
            <h3>Chi tiết sản phẩm: <span th:text="${product.productName}"></span></h3>
        </div>
        <div class="card-body">
            <div class="row mb-3">
                <div class="col-md-4 fw-bold">Mã sản phẩm (ID):</div>
                <div class="col-md-8" th:text="${product.productId}"></div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4 fw-bold">Tên sản phẩm:</div>
                <div class="col-md-8" th:text="${product.productName}"></div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4 fw-bold">Danh mục:</div>
                <div class="col-md-8" th:text="${product.categoryName}"></div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4 fw-bold">Loại sản phẩm:</div>
                <div class="col-md-8" th:text="${product.productType}"></div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4 fw-bold">Giá bán:</div>
                <div class="col-md-8 text-danger fw-bold"
                     th:text="${#numbers.formatDecimal(product.productPrice, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4 fw-bold">Trạng thái:</div>
                <div class="col-md-8">
                    <span th:if="${product.active}" class="badge bg-success">Đang bán</span>
                    <span th:unless="${product.active}" class="badge bg-secondary">Ngừng kinh doanh</span>
                </div>
            </div>
        </div>
        <div class="card-footer text-end">
            <a th:href="@{/admin/products}" class="btn btn-secondary">Quay lại danh sách</a>
            <a th:href="@{/admin/products/edit/{id}(id=${product.productId})}" class="btn btn-warning text-white">Chỉnh sửa</a>
        </div>
    </div>
</div>
</body>
</html>
