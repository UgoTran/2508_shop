<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Spring Multiple Login Pages Demo</title>
</head>
<style>
    .welcome{
        text-align: center;
        font-size: 40px;
    }
    a{
        text-decoration: none;
    }
    .login_1{
        color: deeppink;
    }
    .login_2{
        color: red;
    }
</style>
<body>
<div class="welcome">
    <h2>Welcome to E-SHOP</h2>
    <h4>Login in with <a class="login_1" th:href="@{/admin/login}">ADMIN LOGIN</a></h4>
    <h4>Login in with <a class="login_2" th:href="@{/user/login}">USER LOGIN</a></h4>
</div>
</body>
</html>
