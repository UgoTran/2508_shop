<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>E-Shop Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header-fragment}"></div>

<div class="home-page-area">

    <div class="container-fluid p-0"> <div id="homeBannerCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="3000">

        <div class="carousel-inner">
            <div class="carousel-item active">
                <img th:src="@{/images/banner1.jpg}" class="d-block w-100" alt="Banner 1" style="height: 500px; object-fit: cover;">
            </div>
            <div class="carousel-item">
                <img th:src="@{/images/banner2.jpg}" class="d-block w-100" alt="Banner 2" style="height: 500px; object-fit: cover;">
            </div>
            <div class="carousel-item">
                <img th:src="@{/images/banner3.jpg}" class="d-block w-100" alt="Banner 3" style="height: 500px; object-fit: cover;">
            </div>
            <div class="carousel-item">
                <img th:src="@{/images/banner4.jpg}" class="d-block w-100" alt="Banner 4" style="height: 500px; object-fit: cover;">
            </div>
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#homeBannerCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#homeBannerCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
    </div>

    <div class="container mt-5">
        <h3 class="text-center mb-4" style="font-weight: 600;">Featured Products</h3>
        <div class="row">
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">Product 1 Demo</div>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
