<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        .star-rating {
            direction: rtl;
            display: inline-block;
            cursor: pointer;
        }
        .star-rating input { display: none; }
        .star-rating label {
            color: #ddd;
            font-size: 24px;
            padding: 0 2px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .star-rating label:hover,
        .star-rating label:hover ~ label,
        .star-rating input:checked ~ label {
            color: #ffc107;
        }
    </style>
</head>
<body>
<div class="mt-5 container">
    <div class="mb-4">
        <a href="/" class="text-decoration-none text-dark">Home</a>
        <span class="mx-2 text-muted">></span>
        <span class="text-muted" th:text="${product.title}"></span>
    </div>

    <hr>
    <div class="container mb-5">
        <div class="row">
            <div class="col">
                <div id="carouselExampleSlidesOnly" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner border border-5 rounded">
                        <div class="carousel-item active">
                            <img th:src="${product.image1}" class="d-block w-100" alt="...">
                        </div>
                        <div class="carousel-item">
                            <img th:src="${product.image2}" class="d-block w-100" alt="...">
                        </div>
                    </div>
                </div>
            </div>
            <div class="col">
                <h1 th:text="${product.title}" class="fw-bold"></h1>
                <h4  class="fw-bold text-danger">₹ <span th:text="${product.sellingPrice}"></span></h4>
                <div class="col-md-6">
                    <div class="rating-card">
                        <div class="star-rating animated-stars">
                            <input type="radio" id="star5" name="rating" value="5">
                            <label for="star5" class="bi bi-star-fill"></label>
                            <input type="radio" id="star4" name="rating" value="4">
                            <label for="star4" class="bi bi-star-fill"></label>
                            <input type="radio" id="star3" name="rating" value="3">
                            <label for="star3" class="bi bi-star-fill"></label>
                            <input type="radio" id="star2" name="rating" value="2">
                            <label for="star2" class="bi bi-star-fill"></label>
                            <input type="radio" id="star1" name="rating" value="1">
                            <label for="star1" class="bi bi-star-fill"></label>
                        </div>
                    </div>
                </div>

                <div class="content-container pt-2 pb-2">
                    <div id="foo" th:text="${product.shortDescription}"></div>
                    <span id="showHide">See more -></span>
                </div>

                <form action="/cart/add-to-cart" method="post">
                    <input type="hidden" name="productId" th:value="${product.productId}">
                    <button type="button" class="btn btn-danger rounded-circle" onclick="subtract1()">-</button>
                    <input type="text" id="numValue" name="quantity" value="1" style="width:2rem; text-align:center">
                    <button type="button" class="btn btn-danger rounded-circle" onclick="plus1()">+</button>

                    <button type="submit" class="btn btn-danger" style="margin-left: 3rem">Add To Cart</button>
                    <button type="button" class="btn btn-danger">Buy Now</button>
                </form>
            </div>
        </div>
    </div>

    <div class="container mt-5">
        <div class="btn-group" role="group" aria-label="Basic radio toggle button group">
            <input type="radio" class="btn-check" name="btnradio" id="btnradio1" autocomplete="off" checked>
            <label class="btn btn-outline-danger" for="btnradio1">Features</label>

            <input type="radio" class="btn-check" name="btnradio" id="btnradio2" autocomplete="off">
            <label class="btn btn-outline-danger" for="btnradio2">Reviews (0)</label>
        </div>
        <hr>
    </div>

    <div class="container mt-5">
        Features: <span th:text="${product.productFeatures}"></span>
    </div>
</div>


<script>
    function subtract1() {
        let input = document.getElementById("numValue");
        let currentValue = parseInt(input.value);
        input.value = currentValue - 1;
        if (input.value < 1) input.value = 1;
    }

    function plus1() {
        let input = document.getElementById("numValue");
        let currentValue = parseInt(input.value);
        input.value = currentValue + 1;
    }
</script>

<script>
    document.querySelectorAll('.star-rating:not(.readonly) label').forEach(star => {
        star.addEventListener('click', function() {
            this.style.transform = 'scale(1.2)';
            setTimeout(() => {
                this.style.transform = 'scale(1)';
            }, 200);
        });
    });

    document.addEventListener('DOMContentLoaded', () => {
        let textEle = document.getElementById("foo");
        let toggleButton = document.getElementById("showHide");
        let originalText = textEle.textContent;
        const limit = 200;

        function truncateText() {
            if(originalText.length > limit) {
                textEle.textContent = originalText.substring(0, limit) + '...';
                toggleButton.style.display = 'block'
            } else {
                toggleButton.style.display = 'none';
            }
        }

        function toggleText() {
            if (textEle.textContent.endsWith('...')) {
                textEle.textContent = originalText;
                toggleButton.textContent = 'See Less';
            } else {
                truncateText();
                toggleButton.textContent = 'See More';
            }
        }

        truncateText()
        toggleButton.addEventListener('click', toggleText);
    })

    // document.getElementById("showHide").onclick = function() {
    //     let theDiv = document.getElementById("foo");
    //     if(theDiv.style.display === 'none') {
    //         theDiv.style.display = 'block';
    //         this.innerHTML = 'Hide <-';
    //     } else {
    //         theDiv.style.display = 'none';
    //         this.innerHTML = 'See more ->';
    //     }
    // }
</script>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
        integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
        integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
        crossorigin="anonymous"></script>
</body>
</html>
