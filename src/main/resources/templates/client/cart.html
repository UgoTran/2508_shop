<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
<div class="container mt-5">
    <div class="mb-4">
        <a href="/" class="text-decoration-none text-dark">Home</a>
        <span class="mx-2 text-muted">></span>
        <span class="text-muted">Shopping Cart</span>
    </div>
    <hr>

    <table class="table">
        <thead>
        <tr class="bg-light">
            <th>
                <input type="checkbox" id="select-all">
                <label for="select-all" class="ms-2">Select All</label>
            </th>
            <th>Product Image</th>
            <th>Product Name</th>
            <th>Quantity</th>
            <th>Unit Price</th>
            <th>Total Price</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td>
                <input class="form-check-input cart-checkbox" type="checkbox"
                       th:data-id="${item.cartItemId}"
                       th:data-price="${item.quantity * item.product.sellingPrice}">
            </td>
            <td><img th:src="${item.product.image1}" alt="product" style="width: 50px; height: 50px; object-fit: cover;"></td>
            <td th:text="${item.product.title}"></td>
            <td>
                <input type="number" min="1" class="form-control qty-input" style="width: 80px;"
                       th:value="${item.quantity}"
                       th:data-id="${item.cartItemId}">
            </td>
            <td class="unit-price" th:text="${item.product.sellingPrice}"></td>
            <td class="row-total" th:text="${item.quantity * item.product.sellingPrice}"></td>
            <td>
                <form th:action="@{/cart/remove}" method="post" style="display:inline;">
                    <input type="hidden" name="cartItemId" th:value="${item.cartItemId}">
                    <button type="submit" class="btn btn-sm btn-danger">Remove</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="d-flex justify-content-end mb-4">
        <div class="border p-3 w-50">
            <h5 class="bg-light p-2">Total Price</h5>
            <div class="d-flex justify-content-between">
                <span>Sub Total:</span>
                <span id="subtotal">0 ₫</span>
            </div>
            <div class="d-flex justify-content-between">
                <span>Delivery Charge:</span>
                <span>+ 0 ₫</span>
            </div>
            <hr>
            <div class="d-flex justify-content-between fw-bold text-danger">
                <span>Payment Amount:</span>
                <span id="payment-amount">0 ₫</span>
            </div>
        </div>
    </div>

    <button type="button" class="btn btn-primary btn-lg" onclick="proceedToCheckout()">
        Proceed To Checkout
    </button>
</div>

<script>
    let selectedIds = [];

    function saveSelectionToCookie() {
        selectedIds = Array.from(document.querySelectorAll('.cart-checkbox:checked'))
            .map(cb => parseInt(cb.dataset.id));
        document.cookie = "cart_state=" + encodeURIComponent(JSON.stringify({selectedItemIds: selectedIds})) + "; path=/";
    }

    function updateTotal() {
        let total = 0;
        document.querySelectorAll('.cart-checkbox:checked').forEach(cb => {
            total += parseFloat(cb.dataset.price) || 0;
        });
        const formatted = total.toLocaleString('vi-VN') + ' ₫';
        document.getElementById('subtotal').textContent = formatted;
        document.getElementById('payment-amount').textContent = formatted;
    }

    document.querySelectorAll('.qty-input').forEach(input => {
        input.addEventListener('change', function() {
            if (this.value < 1) this.value = 1;

            const row = this.closest('tr');
            const unitPrice = parseFloat(row.querySelector('.unit-price').textContent.replace(/[^0-9.-]+/g,""));
            const newQty = parseInt(this.value);
            const newTotal = unitPrice * newQty;

            row.querySelector('.row-total').textContent = newTotal.toLocaleString('vi-VN') + ' ₫';

            const checkbox = row.querySelector('.cart-checkbox');
            checkbox.dataset.price = newTotal;

            if (checkbox.checked) updateTotal();
        });
    });

    document.querySelectorAll('.cart-checkbox').forEach(cb => {
        cb.addEventListener('change', () => {
            updateTotal();
            saveSelectionToCookie();
        });
    });

    document.getElementById('select-all').addEventListener('change', function() {
        document.querySelectorAll('.cart-checkbox').forEach(cb => {
            cb.checked = this.checked;
        });
        updateTotal();
        saveSelectionToCookie();
    });

    const cookie = document.cookie.split('; ').find(row => row.startsWith('cart_state='));
    if (cookie) {
        try {
            const ids = JSON.parse(decodeURIComponent(cookie.split('=')[1])).selectedItemIds;
            document.querySelectorAll('.cart-checkbox').forEach(cb => {
                cb.checked = ids.includes(parseInt(cb.dataset.id));
            });
            updateTotal();
        } catch (e) {}
    }

    function proceedToCheckout() {
        const selected = document.querySelectorAll('.cart-checkbox:checked');
        if (selected.length === 0) {
            alert("Vui lòng chọn ít nhất một sản phẩm!");
            return;
        }

        const updates = [];
        selected.forEach(cb => {
            const row = cb.closest('tr');
            const cartItemId = cb.dataset.id;
            const quantity = row.querySelector('.qty-input').value;

            updates.push(
                fetch('/cartItem/update-quantity', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `cartItemId=${cartItemId}&quantity=${quantity}`
                })
            );
        });

        Promise.all(updates)
            .then(() => window.location.href = '/checkout')
            .catch(() => alert("Có lỗi xảy ra khi cập nhật giỏ hàng!"));
    }

    updateTotal();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
