<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="header-fragment">

    <div class="header-middle-area">
        <div class="container">
            <div class="row align-items-center">

                <div class="col-md-3 col-sm-3 col-xs-12">
                    <div class="logo">
                        <a th:href="@{/}">
                            <img th:src="@{/images/logo.png}" alt="Logo" style="max-height: 50px;">
                        </a>
                    </div>
                </div>

                <div class="col-md-7 col-sm-6 col-xs-12">
                    <div class="search-box-area">
                        <form action="#" method="get" class="search-form">
                            <div class="select-area">
                                <select name="category">
                                    <option value="all">All Categories</option>
                                    <option value="fashion">Fashion</option>
                                    <option value="electronics">Electronics</option>
                                </select>
                            </div>
                            <input type="text" placeholder="Search here..." class="search-input">
                            <button type="submit" class="search-btn">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </button>
                        </form>
                    </div>
                </div>

                <div class="col-md-2 col-sm-3 col-xs-12">
                    <ul class="header-actions">
                        <li class="action-item user-dropdown-wrap">
                            <a href="#"><i class="fa-regular fa-user"></i></a>
                            <ul class="user-dropdown">
                                <li><a th:href="@{/login}">Login & Register</a></li>
                            </ul>
                        </li>

                        <li class="action-item cart-dropdown-wrap">
                            <a th:href="@{/cart}" title="Shopping Cart" class="cart-icon-link">
                                <i class="fa-solid fa-cart-shopping"></i>
                                <span class="cart-count">0</span>
                            </a>
                            <ul class="cart-dropdown">
                                <li class="text-center" style="padding: 15px">
                                    <h4 style="font-weight: 500; font-size: 14px;">You have not login now!</h4>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>

            </div>
        </div>
    </div>

    <div class="header-bottom-area header-sticky">
        <div class="container">
            <div class="row">

                <div class="col-md-3 col-sm-3">
                    <div class="side-menu">
                        <div class="category-heading">
                            <h2><i class="fa-solid fa-bars"></i> <span>CATEGORIES</span></h2>
                        </div>
                        <div class="category-menu-list">
                            <ul>
                                <li class="right-menu">
                                    <a th:href="@{/category/jewellery}">Jewellery <i class="fa-solid fa-chevron-right float-end"></i></a>
                                    <ul class="cat-dropdown">
                                        <li><a th:href="@{/category/jewellery/necklaces}">Necklaces</a></li>
                                        <li><a th:href="@{/category/jewellery/bangle}">Bangle & Bracelets</a></li>
                                    </ul>
                                </li>
                                <li class="right-menu">
                                    <a th:href="@{/category/home-appliance}">Home Appliance <i class="fa-solid fa-chevron-right float-end"></i></a>
                                    <ul class="cat-dropdown">
                                        <li><a th:href="@{/category/home/decor}">Home & Decor</a></li>
                                        <li><a th:href="@{/category/home/refrigerator}">Refrigerator</a></li>
                                    </ul>
                                </li>
                                <li><a th:href="@{/category/footwear}">Footwear</a></li>
                                <li><a th:href="@{/category/electronics}">Electronics</a></li>
                                <li><a th:href="@{/category/clothing}">Clothing</a></li>
                                <li><a th:href="@{/category/beauty}">Beauty & Health</a></li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="col-md-9 col-sm-9">
                    <div class="main-menu-area">
                        <nav>
                            <ul>
                                <li><a th:href="@{/}">HOME</a></li>
                                <li><a th:href="@{/offer}">OFFER</a></li>
                                <li><a th:href="@{/deals}">TODAY DEALS</a></li>
                                <li><a th:href="@{/contact}">CONTACT US</a></li>
                            </ul>
                        </nav>
                    </div>
                </div>

            </div>
        </div>
    </div>

</div>
</body>
</html>
