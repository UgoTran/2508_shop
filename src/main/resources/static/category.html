<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Categories | E-Commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #fff; font-family: Arial, sans-serif; }
        .category-card {
            border-radius: 8px; overflow: hidden; background: #fff;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1); transition: transform .2s; cursor: pointer;
        }
        .category-card:hover { transform: translateY(-5px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .category-card img { width: 100%; height: 160px; object-fit: cover; }
        .category-title { padding: 12px; font-size: 17px; text-align: center; font-weight: bold; color: #333; }
        .breadcrumb-area { padding: 20px 80px; font-size: 15px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-danger p-3">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold fs-3" href="/">E-Commerce</a>
    </div>
</nav>

<div class="breadcrumb-area">
    <a href="/" style="text-decoration: none; color: inherit;">Home</a>
    <span> > Categories</span>
</div>

<div class="container mb-5">
    <h3 class="text-center mb-4 fw-bold">ALL CATEGORIES</h3>
    <div id="categories" class="row g-4">
        <div class="col-12 text-center"><div class="spinner-border text-danger"></div></div>
    </div>
</div>

<script>
    fetch("/api/category")
        .then(res => res.json())
        .then(categories => {
            const container = document.getElementById("categories");
            container.innerHTML = ''; // Xóa loading

            categories.forEach(cat => {
                // LOGIC SLUG: Đổi khoảng trắng thành gạch ngang
                // "Women Footwear" -> "Women-Footwear"
                const slug = cat.title.replace(/\s+/g, '-');
                const targetUrl = `/category/${encodeURIComponent(slug)}`;

                const col = document.createElement("div");
                col.className = "col-md-3";
                col.innerHTML = `
                    <div class="category-card" onclick="window.location.href='${targetUrl}'">
                        <img src="${cat.imageLink || 'https://via.placeholder.com/300x160'}" alt="${cat.title}">
                        <div class="category-title">${cat.title}</div>
                    </div>
                `;
                container.appendChild(col);
            });
        })
        .catch(err => console.error(err));
</script>
</body>
</html>
