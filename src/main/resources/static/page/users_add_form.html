<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm mới User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Thêm Người Dùng Mới</h4>
                </div>
                <div class="card-body">
                    <form id="addForm">

                        <div class="mb-3">
                            <label class="form-label">Platform</label>
                            <select id="platform" class="form-select" required>
                                <option value="WEB">WEB</option>
                                <option value="IOS">IOS</option>
                                <option value="ANDROID">ANDROID</option>
                                <option value="OTHER" selected>OTHER</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Họ và Tên</label>
                            <input type="text" id="name" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Số điện thoại</label>
                            <input type="text" id="phoneNumber" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Ngày tạo</label>
                            <input type="datetime-local" id="createdAt" class="form-control" required>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="status" checked>
                            <label class="form-check-label">Kích hoạt ngay (Status ON)</label>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="users_list.html" class="btn btn-secondary me-2">Hủy</a>
                            <button type="submit" class="btn btn-success">Lưu lại</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById("addForm").addEventListener("submit", function(e) {
        e.preventDefault();

        let createdAtValue = document.getElementById("createdAt").value;

        // Nếu chưa có giây → thêm ":00"
        if (createdAtValue.length === 16) {
            createdAtValue += ":00";
        }

        const userData = {
            platform: document.getElementById("platform").value,
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            phoneNumber: document.getElementById("phoneNumber").value,
            status: document.getElementById("status").checked,
            createdAt: createdAtValue
        };

        const API_URL = "http://localhost:8080/admin/users";

        fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(userData)
        })
        .then(res => {
            if (res.ok) {
                alert("Thêm người dùng mới thành công!");
                window.location.href = "users_list.html";
            } else {
                res.text().then(text => {
                    alert("Lỗi khi thêm! \n" + text);
                    console.error(text);
                });
            }
        })
        .catch(err => {
            console.error("Network Error:", err);
            alert("Lỗi kết nối tới Server Spring Boot.");
        });
    });
</script>

</body>
</html>
