<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0">Cập nhật thông tin</h4>
                </div>

                <div class="card-body">
                    <form id="editForm">
                        <input type="hidden" id="userId">

                        <!-- KHÔNG CÒN HÌNH ẢNH -->

                        <div class="mb-3">
                            <label class="form-label">Platform</label>
                            <select id="platform" class="form-select" required>
                                <option value="WEB">WEB</option>
                                <option value="IOS">IOS</option>
                                <option value="ANDROID">ANDROID</option>
                                <option value="OTHER">OTHER</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Họ và Tên</label>
                            <input type="text" id="name" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Số điện thoại</label>
                            <input type="text" id="phoneNumber" class="form-control" required>
                        </div>

                        <!-- NGÀY TẠO: datetime-local -->
                        <div class="mb-3">
                            <label class="form-label">Ngày tạo (Chỉnh sửa được)</label>
                            <input type="datetime-local" id="createdAt" class="form-control" required>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="status">
                            <label class="form-check-label">Trạng thái hoạt động</label>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="users_list.html" class="btn btn-secondary me-2">Quay lại</a>
                            <button type="submit" class="btn btn-warning">Lưu thay đổi</button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const userId = params.get("id");
    const API_URL = `http://localhost:8080/admin/users`;

    // Chuyển từ "2025-12-17T15:42:00" → "2025-12-17T15:42"
    function convertToDateTimeLocal(str) {
        if (!str) return "";
        return str.substring(0, 16);
    }

    // Khi load User
    if (userId) {
        fetch(`${API_URL}/${userId}`)
            .then(res => res.json())
            .then(user => {
                document.getElementById("userId").value = user.userId;
                document.getElementById("name").value = user.name;
                document.getElementById("email").value = user.email;
                document.getElementById("phoneNumber").value = user.phoneNumber;
                document.getElementById("platform").value = user.platform || 'OTHER';
                document.getElementById("status").checked = user.status;

                // Load createdAt có chỉnh sửa (FULL ngày giờ)
                document.getElementById("createdAt").value = convertToDateTimeLocal(user.createdAt);
            })
            .catch(err => alert("Không tải được dữ liệu người dùng!"));
    }

    // Khi lưu
    document.getElementById("editForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const userData = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            phoneNumber: document.getElementById("phoneNumber").value,
            platform: document.getElementById("platform").value,
            createdAt: document.getElementById("createdAt").value + ":00", // thêm giây
            status: document.getElementById("status").checked
        };

        fetch(`${API_URL}/${userId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(userData)
        })
            .then(res => {
                if (res.ok) {
                    alert("Cập nhật thành công!");
                    window.location.href = "users_list.html";
                } else {
                    res.text().then(t => alert("Lỗi: " + t));
                }
            })
            .catch(() => alert("Không kết nối được server!"));
    });
</script>
</body>
</html>
