<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test E-Shop Spring Boot</title>
    <style>
        /* --- CSS GIỐNG HÌNH ẢNH CŨ --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f9f9f9; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }

        /* Category Header Styles */
        .category-section { margin-bottom: 40px; background: #fff; border: 1px solid #eee; border-radius: 4px; padding-bottom: 20px;}
        .category-header {
            background-color: #ff4747;
            color: white;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            display: inline-block;
            border-bottom-right-radius: 4px;
        }
        .category-divider { border-bottom: 1px solid #ff4747; margin-top: -5px; margin-bottom: 20px; }

        /* Grid & Card Styles */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            padding: 0 20px;
        }
        .product-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: 0.2s;
        }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-color: #ff4747;}

        .product-image {
            width: 100%; height: 180px; object-fit: contain; margin-bottom: 10px;
            background-color: #f0f0f0; /* Màu nền cho ảnh placeholder */
        }

        .product-name { font-size: 14px; color: #333; margin-bottom: 8px; font-weight: 500; height: 36px; overflow: hidden; }
        .product-price { color: #ff4747; font-weight: bold; font-size: 16px; }

        .error-msg { color: red; padding: 20px; text-align: center; }
    </style>
</head>
<body>

<div class="container" id="app">
    <div style="text-align:center; margin-top: 50px; color: #666;">
        Đang tải dữ liệu từ API... <br>
        (Đảm bảo Backend đang chạy tại port 8080)
    </div>
</div>

<script>
    // --- CẤU HÌNH ---
    // Danh sách các Category bạn muốn hiển thị (Phải khớp với category_name trong DB)
    const categoriesToLoad = ["Điện thoại", "Giày dép", "Laptop"];
    const API_BASE_URL = "http://localhost:8080/admin/products/category";

    const appContainer = document.getElementById('app');

    // Hàm format tiền VND
    const formatMoney = (amount) => {
        return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
    };

    // Hàm load dữ liệu
    async function loadData() {
        appContainer.innerHTML = ""; // Xóa loading text

        for (const catName of categoriesToLoad) {
            try {
                // Gọi API Spring Boot
                const response = await fetch(`${API_BASE_URL}/${catName}`);

                if (!response.ok) {
                    console.warn(`Không tìm thấy category: ${catName}`);
                    continue;
                }

                const json = await response.json();

                // Kiểm tra status từ Backend trả về
                if (json.status === 'success') {
                    renderCategorySection(catName, json.data);
                } else {
                    console.log(`API trả về lỗi cho mục ${catName}: ${json.message}`);
                }

            } catch (error) {
                console.error("Lỗi kết nối:", error);
                appContainer.innerHTML += `<div class="error-msg">Lỗi kết nối tới Backend. Hãy kiểm tra Console (F12).</div>`;
                break; // Dừng vòng lặp nếu server chết
            }
        }
    }

    // Hàm vẽ HTML
    function renderCategorySection(categoryName, products) {
        let html = `
            <div class="category-section">
                <h2 class="category-header">${categoryName}</h2>
                <div class="category-divider"></div>
                <div class="product-grid">
        `;

        products.forEach(p => {
            // Lưu ý: Mapping đúng tên biến trong Entity Java của bạn
            // Product.java: productName, productPrice
            // Ảnh: Dùng ảnh placeholder vì Entity của bạn chưa có trường image

            html += `
                <div class="product-card">
                    <img src="https://via.placeholder.com/200?text=${p.productName}" class="product-image" alt="SP">
                    <h3 class="product-name">${p.productName}</h3>
                    <div class="product-price">${formatMoney(p.productPrice)}</div>
                </div>
            `;
        });

        html += `</div></div>`;
        appContainer.innerHTML += html;
    }

    // Chạy hàm
    loadData();
</script>
</body>
</html>
