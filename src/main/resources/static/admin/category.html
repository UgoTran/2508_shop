<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .card { box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .table-action-btn { margin-right: 5px; cursor: pointer; }
        /* Toggle Switch Styling fix if needed */
        .form-check-input { cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="row mb-4">
        <div class="col-12 text-center">
            <h2 class="text-primary fw-bold">Quản Lý Danh Mục (Category)</h2>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body d-flex justify-content-between align-items-center">
            <h5 class="card-title m-0">Danh sách Categories</h5>
            <button class="btn btn-success" onclick="openCreateModal()">
                <i class="fa-solid fa-plus"></i> Thêm Mới
            </button>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th scope="col" style="width: 10%">ID</th>
                    <th scope="col" style="width: 40%">Category Title</th>
                    <th scope="col" style="width: 15%">Image</th>
                    <th scope="col" style="width: 15%">Status (On/Off)</th>
                    <th scope="col" style="width: 20%">Actions</th>
                </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="categoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Thêm Mới Category</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="categoryForm">
                    <input type="hidden" id="catId">

                    <div class="mb-3">
                        <label for="catTitle" class="form-label">Tên Danh Mục</label>
                        <input type="text" class="form-control" id="catTitle" required placeholder="Nhập tên danh mục...">
                    </div>

                    <div class="mb-3">
                        <label for="catImage" class="form-label">Link Ảnh (Optional)</label>
                        <input type="text" class="form-control" id="catImage" placeholder="http://example.com/image.jpg">
                    </div>

                    <div class="mb-3 form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="catActive" checked>
                        <label class="form-check-label" for="catActive">Is Active?</label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                <button type="button" class="btn btn-primary" onclick="saveCategory()">Lưu Lại</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const API_URL = '/api/admin/category';
    let categoryModal; // Bootstrap modal instance
    let currentCategories = []; // Store data locally for easier access

    document.addEventListener('DOMContentLoaded', () => {
        categoryModal = new bootstrap.Modal(document.getElementById('categoryModal'));
        loadCategories();
    });

    // 1. Load Data
    async function loadCategories() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            currentCategories = data;
            renderTable(data);
        } catch (error) {
            console.error('Error loading data:', error);
            Swal.fire('Error', 'Không thể tải dữ liệu!', 'error');
        }
    }

    // 2. Render Table (Đã chỉnh sửa: Bỏ badge ON/OFF)
    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if(data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center">Chưa có dữ liệu</td></tr>';
            return;
        }

        data.forEach(cat => {
            const isActive = cat.isActive ? 'checked' : '';
            const imgDisplay = cat.imageLink ? `<img src="${cat.imageLink}" alt="img" style="height:40px; border-radius:4px;">` : '-';

            const row = `
                <tr>
                    <td>${cat.categoryId}</td>
                    <td class="fw-bold text-primary">${cat.title}</td>
                    <td>${imgDisplay}</td>
                    <td>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox"
                                onchange="toggleStatus(${cat.categoryId}, this.checked)" ${isActive}>
                            </div>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-warning table-action-btn" onclick="openEditModal(${cat.categoryId})">
                            <i class="fa-solid fa-pen"></i> Edit
                        </button>
                        <button class="btn btn-sm btn-outline-danger table-action-btn" onclick="deleteCategory(${cat.categoryId})">
                            <i class="fa-solid fa-trash"></i> Delete
                        </button>
                    </td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    // 3. Open Modal for Create
    function openCreateModal() {
        document.getElementById('modalTitle').innerText = 'Thêm Mới Category';
        document.getElementById('categoryForm').reset();
        document.getElementById('catId').value = '';
        document.getElementById('catActive').checked = true; // Default Active
        categoryModal.show();
    }

    // 4. Open Modal for Edit
    function openEditModal(id) {
        const cat = currentCategories.find(c => c.categoryId === id);
        if (!cat) return;

        document.getElementById('modalTitle').innerText = 'Cập Nhật Category';
        document.getElementById('catId').value = cat.categoryId;
        document.getElementById('catTitle').value = cat.title;
        document.getElementById('catImage').value = cat.imageLink || '';
        document.getElementById('catActive').checked = cat.isActive;

        categoryModal.show();
    }

    // 5. Save (Create or Update)
    // 5. Save (Create or Update) - ĐÃ SỬA LỖI 405
    async function saveCategory() {
        const id = document.getElementById('catId').value;
        const title = document.getElementById('catTitle').value;
        const imageLink = document.getElementById('catImage').value;
        const isActive = document.getElementById('catActive').checked;

        if (!title.trim()) {
            Swal.fire('Lỗi', 'Vui lòng nhập tên danh mục', 'warning');
            return;
        }

        const payload = {
            title: title,
            imageLink: imageLink,
            isActive: isActive
        };

        // --- SỬA ĐOẠN NÀY ĐỂ KHỚP VỚI RESTFUL API ---
        let url = API_URL;      // Mặc định POST vào /api/admin/category
        let method = 'POST';

        // Nếu có ID => Đang là Update => Đổi sang PUT và nối ID vào URL
        if (id) {
            url = `${API_URL}/${id}`;
            method = 'PUT';
            payload.categoryId = parseInt(id);
        }
        // ---------------------------------------------

        try {
            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                categoryModal.hide();
                Swal.fire('Thành công', 'Đã lưu dữ liệu!', 'success');
                loadCategories(); // Reload table
            } else {
                // Đọc lỗi từ server nếu có
                const errText = await response.text();
                Swal.fire('Lỗi', 'Không thể lưu dữ liệu: ' + errText, 'error');
            }
        } catch (error) {
            console.error(error);
            Swal.fire('Lỗi', 'Lỗi kết nối server', 'error');
        }
    }

    // 6. Delete
    function deleteCategory(id) {
        Swal.fire({
            title: 'Bạn chắc chắn chứ?',
            text: "Dữ liệu sẽ bị xóa vĩnh viễn!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'Vâng, xóa đi!'
        }).then(async (result) => {
            if (result.isConfirmed) {
                try {
                    const response = await fetch(`${API_URL}/delete/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        Swal.fire('Đã xóa!', 'Category đã bị xóa.', 'success');
                        loadCategories();
                    } else {
                        Swal.fire('Lỗi', 'Không thể xóa (có thể do ràng buộc dữ liệu)', 'error');
                    }
                } catch (error) {
                    Swal.fire('Lỗi', 'Lỗi hệ thống', 'error');
                }
            }
        });
    }

    // 7. Toggle Status directly from Table
    async function toggleStatus(id, newStatus) {
        // Tìm category hiện tại để lấy title và image (vì API save cần object)
        const cat = currentCategories.find(c => c.categoryId === id);
        if (!cat) return;

        const payload = {
            ...cat, // Copy các thuộc tính cũ
            isActive: newStatus // Cập nhật status mới
        };

        try {
            const response = await fetch(`${API_URL}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                // Refresh lại để cập nhật Badge ON/OFF
                loadCategories();
                const toast = Swal.mixin({
                    toast: true, position: 'top-end', showConfirmButton: false, timer: 1500
                });
                toast.fire({ icon: 'success', title: 'Cập nhật trạng thái thành công' });
            } else {
                // Revert switch if fail
                loadCategories();
                Swal.fire('Lỗi', 'Không cập nhật được trạng thái', 'error');
            }
        } catch (error) {
            loadCategories();
            console.error(error);
        }
    }
</script>

</body>
</html>
