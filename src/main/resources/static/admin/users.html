<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Người Dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            padding-top: 20px;
            background-color: #f8f9fa;
        }
        .user-image {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <h1 class="mb-4 text-center text-primary">Danh Sách Người Dùng</h1>

    <div class="row mb-3">
        <div class="col-12 text-end">
            <a href="/admin/users/add" class="btn btn-success" id="addUserButton">
                <i class="bi bi-person-plus-fill"></i> Thêm Người Dùng
            </a>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="table-responsive shadow-sm bg-white p-3 rounded">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Ảnh</th>
                        <th>Tên Đăng Nhập</th>
                        <th>Họ và Tên</th>
                        <th>Email</th>
                        <th>SĐT</th>
                        <th>Trạng thái</th> <th>Hành động</th>
                    </tr>
                    </thead>
                    <tbody id="userTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_USERS_URL = '/api/users';
    const API_TOGGLE_BAN = '/api/users/toggle-ban/';
    const userTableBody = document.getElementById('userTableBody');

    // Hàm tạo badge (label) hiển thị trạng thái
    function createStatusBadge(isBan) {
        if (isBan === 1) {
            return `<span class="badge bg-danger">BỊ CẤM</span>`;
        }
        return `<span class="badge bg-success">HOẠT ĐỘNG</span>`;
    }

    // Hàm render dữ liệu vào bảng
    function renderTable(users) {
        userTableBody.innerHTML = ''; // Xóa nội dung cũ

        users.forEach(user => {
            const row = userTableBody.insertRow();

            row.insertCell().textContent = user.userId;

            const imageCell = row.insertCell();
            imageCell.innerHTML = `<img src="${user.image || 'https://via.placeholder.com/40?text=No'}" alt="Image" class="user-image">`;

            row.insertCell().textContent = user.username;
            row.insertCell().textContent = user.name || '';
            row.insertCell().textContent = user.email;
            row.insertCell().textContent = user.phoneNumber;

            // 1. Ô Trạng thái (Cột mới)
            const statusCell = row.insertCell();
            statusCell.id = `status-cell-${user.userId}`; // Đặt ID cho ô để cập nhật
            statusCell.innerHTML = createStatusBadge(user.isBan);

            // 2. Ô Hành động (bao gồm nút Toggle)
            const actionCell = row.insertCell();
            actionCell.className = 'text-nowrap'; // Ngăn không cho các nút bị xuống dòng

            // Nút Xem chi tiết
            const viewBtn = document.createElement('a');
            viewBtn.href = `/admin/users/profile/${user.userId}`;
            viewBtn.className = 'btn btn-sm btn-primary me-2';
            viewBtn.innerHTML = '<i class="bi bi-eye-fill"></i>';
            actionCell.appendChild(viewBtn);

            // Nút Sửa (Edit)
            const editBtn = document.createElement('a');
            editBtn.href = `/admin/users/edit/${user.userId}`;
            editBtn.className = 'btn btn-sm btn-info me-2';
            editBtn.innerHTML = '<i class="bi bi-pencil-square"></i>';
            actionCell.appendChild(editBtn);

            // Nút Toggle Ban/Unban
            const toggleBtn = document.createElement('button');
            toggleBtn.className = user.isBan === 1 ? 'btn btn-sm btn-success me-2' : 'btn btn-sm btn-danger me-2';
            toggleBtn.title = user.isBan === 1 ? 'Hủy Cấm Tài Khoản' : 'Cấm Tài Khoản';
            toggleBtn.innerHTML = user.isBan === 1 ? '<i class="bi bi-unlock-fill"></i>' : '<i class="bi bi-lock-fill"></i>';

            toggleBtn.dataset.userId = user.userId; // Lưu ID người dùng
            toggleBtn.addEventListener('click', handleToggleBan);
            actionCell.appendChild(toggleBtn);

            // Nút Xóa
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn btn-sm btn-danger';
            deleteBtn.innerHTML = '<i class="bi bi-trash-fill"></i>';
            deleteBtn.dataset.id = user.userId;
            deleteBtn.dataset.username = user.username;
            actionCell.appendChild(deleteBtn);
        });

        // Gán sự kiện cho các nút xóa sau khi render xong
        attachDeleteEventListeners();
    }

    /**
     * Hàm xử lý khi nhấn nút toggle (PUT /api/users/toggle-ban/{id})
     */
    async function handleToggleBan(event) {
        const btn = event.currentTarget;
        const userId = btn.dataset.userId;
        const isBanned = btn.className.includes('btn-danger'); // Kiểm tra trạng thái hiện tại (danger = hoạt động, sẽ chuyển sang cấm)
        const actionText = isBanned ? 'Cấm' : 'Hủy Cấm';

        if (!confirm(`Bạn có chắc chắn muốn ${actionText.toLowerCase()} người dùng ID ${userId} không?`)) {
            return;
        }

        const originalHTML = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>';

        try {
            // GỌI API PUT /api/users/toggle-ban/{id}
            const response = await fetch(API_TOGGLE_BAN + userId, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' }
            });

            if (response.ok) {
                const updatedUser = await response.json();
                const newStatus = updatedUser.isBan;

                // Cập nhật Badge Trạng thái
                document.getElementById(`status-cell-${userId}`).innerHTML = createStatusBadge(newStatus);

                // Cập nhật nút Toggle (đảo ngược lại)
                btn.className = newStatus === 1 ? 'btn btn-sm btn-success me-2' : 'btn btn-sm btn-danger me-2';
                btn.title = newStatus === 1 ? 'Hủy Cấm Tài Khoản' : 'Cấm Tài Khoản';
                btn.innerHTML = newStatus === 1 ? '<i class="bi bi-unlock-fill"></i>' : '<i class="bi bi-lock-fill"></i>';

            } else {
                alert('Lỗi: Không thể thay đổi trạng thái.');
            }
        } catch (error) {
            console.error('Lỗi mạng:', error);
            alert('Lỗi mạng hoặc server không phản hồi.');
        } finally {
            btn.disabled = false;
        }
    }


    /**
     * Tải danh sách người dùng từ API (GET /api/users)
     */
    async function fetchUsers() {
        try {
            const response = await fetch(API_USERS_URL);
            if (response.ok) {
                const users = await response.json();
                renderTable(users);
            } else {
                console.error("Lỗi khi tải danh sách người dùng.");
                userTableBody.innerHTML = '<tr><td colspan="8" class="text-center text-danger">Không thể tải dữ liệu người dùng.</td></tr>';
            }
        } catch (error) {
            console.error("Lỗi mạng:", error);
            userTableBody.innerHTML = '<tr><td colspan="8" class="text-center text-danger">Lỗi kết nối mạng.</td></tr>';
        }
    }

    /**
     * Gán sự kiện xóa cho các nút trong bảng
     */
    function attachDeleteEventListeners() {
        document.querySelectorAll('button[data-id][data-username]').forEach(button => {
            if (button.textContent.trim() !== '') return; // Chỉ gán cho nút Xóa
            button.addEventListener('click', function() {
                const id = this.getAttribute('data-id');
                const username = this.getAttribute('data-username');
                deleteUser(id, username);
            });
        });
    }

    /**
     * Hàm gọi API để xóa người dùng (DELETE /api/users/{id})
     * @param {number} id - ID của người dùng cần xóa
     * @param {string} username - Tên người dùng để hiển thị trong xác nhận
     */
    async function deleteUser(id, username) {
        if (!confirm(`Bạn có chắc chắn muốn xóa người dùng "${username}" (ID: ${id}) không? Hành động này không thể hoàn tác.`)) {
            return;
        }

        try {
            const response = await fetch(`${API_USERS_URL}/${id}`, {
                method: 'DELETE',
            });

            // UserController trả về ResponseEntity.noContent().build(), tức là status 204
            if (response.status === 204) {
                alert(`Đã xóa người dùng ${username} thành công!`);
                fetchUsers(); // Tải lại danh sách sau khi xóa
            } else {
                // Xử lý các lỗi khác (ví dụ: User not found)
                const errorResponse = await response.text();
                // Thử phân tích JSON nếu có thể
                let errorMessage = `Lỗi không xác định (${response.status})`;
                try {
                    const errorJson = JSON.parse(errorResponse);
                    errorMessage = errorJson.message || errorResponse;
                } catch (e) {
                    // Nếu không phải JSON, dùng text
                }
                throw new Error(errorMessage);
            }

        } catch (error) {
            console.error('Lỗi khi xóa người dùng:', error);
            alert(`Xóa người dùng thất bại: ${error.message}`);
        }
    }

    // Tải danh sách người dùng khi trang được load
    fetchUsers();
</script>
</body>
</html>
