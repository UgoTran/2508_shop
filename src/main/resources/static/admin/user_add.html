<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Người Dùng Mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { padding-top: 20px; background-color: #f8ffde; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card shadow-lg border-primary">
                <div class="card-header bg-primary text-white text-center">
                    <h4 class="mb-0"><i class="bi bi-person-plus-fill"></i> Thêm Người Dùng Mới</h4>
                </div>
                <div class="card-body">
                    <form id="addUserForm">

                        <div class="mb-3">
                            <label for="username" class="form-label">Tên Đăng Nhập (*)</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Mật Khẩu (*)</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="mb-3">
                            <label for="name" class="form-label">Họ và Tên</label>
                            <input type="text" class="form-control" id="name" name="name">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email (*)</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="phoneNumber" class="form-label">Số Điện Thoại (*)</label>
                            <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber" required>
                        </div>
                        <div class="mb-3">
                            <label for="image" class="form-label">URL Ảnh Đại Diện</label>
                            <input type="text" class="form-control" id="image" name="image">
                        </div>

                        <div class="mb-3 form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="isBan" name="isBan" role="switch">
                            <label class="form-check-label" for="isBan">Cấm Tài Khoản Ngay Lập Tức</label>
                            <small class="form-text text-muted">(Bỏ chọn: Hoạt động. Chọn: Bị cấm)</small>
                        </div>

                        <div id="alertMessage" class="mt-3"></div>

                        <div class="d-flex justify-content-between">
                            <a href="/admin/users" class="btn btn-secondary">
                                <i class="bi bi-arrow-left-circle-fill"></i> Quay Lại
                            </a>
                            <button type="submit" class="btn btn-primary" id="submitBtn">
                                <i class="bi bi-plus-circle-fill"></i> Lưu Người Dùng
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_ADD_URL = '/api/users/add';
    const form = document.getElementById('addUserForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertContainer = document.getElementById('alertMessage');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        // Lấy trạng thái của Switch (checkbox)
        const isBanChecked = document.getElementById('isBan').checked;

        // Lấy dữ liệu từ form
        const data = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phoneNumber: document.getElementById('phoneNumber').value,
            image: document.getElementById('image').value,
            // Thêm trường isBan: 1 nếu được chọn (cấm), 0 nếu không chọn (hoạt động)
            isBan: isBanChecked ? 1 : 0
        };

        // Hiển thị trạng thái tải
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Đang xử lý...';
        alertContainer.innerHTML = '';

        try {
            const response = await fetch(API_ADD_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
            });

            const responseData = await response.json();

            if (response.ok && response.status === 201) { // 201 Created
                alertContainer.innerHTML = `<div class="alert alert-success"><i class="bi bi-check-circle-fill"></i> Thêm người dùng **${responseData.username}** thành công!</div>`;
                form.reset(); // Xóa nội dung form

                // Khôi phục trạng thái mặc định của switch
                document.getElementById('isBan').checked = false;

                // Tùy chọn: chuyển hướng sau 2 giây
                setTimeout(() => {
                    window.location.href = '/admin/users';
                }, 2000);
            } else {
                // Xử lý lỗi từ server (ví dụ: email/sdt đã tồn tại)
                const errorMessage = responseData.message || 'Lỗi không xác định khi thêm người dùng.';
                alertContainer.innerHTML = `<div class="alert alert-danger"><i class="bi bi-x-octagon-fill"></i> Lỗi: ${errorMessage}</div>`;
            }

        } catch (error) {
            console.error('Lỗi mạng hoặc lỗi không xác định:', error);
            alertContainer.innerHTML = `<div class="alert alert-danger"><i class="bi bi-exclamation-triangle-fill"></i> Đã xảy ra lỗi mạng. Vui lòng thử lại.</div>`;
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-plus-circle-fill"></i> Lưu Người Dùng';
        }
    });
</script>
</body>
</html>
